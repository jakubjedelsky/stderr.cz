{% extends "base.html" %}
{% block title %}Archiv @ {{ super() }}{% endblock %}
{% block content %}

<h2>Archiv</h2>
<table>
{% for article in dates %}
    <tr>
        <td><time>{{ article.locale_date }}</time></td>
        <td><a href="{{ article.url }}">{{ article.title }}</a></td>
    </tr>
{% endfor %}
</table>

{% endblock %}
