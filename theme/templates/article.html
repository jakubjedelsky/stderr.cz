{% extends "base.html" %}
{% block title %}{{ article.title }} @ {{ super() }}{% endblock %}
{% block twittercard %}
    <meta name="twitter:card" value="summary" />
    <meta name="twitter:creator" content="@{{ TWITTER_NAME }}" />
    <meta name="twitter:title" content="{{ article.title }}" />
    <meta name="twitter:description" content="{{ article.content|striptags|truncate(length=200, killwords=False) }}" />
{% endblock %}

{% block content %}
<article>
    <h2>{{ article.title }}</h2>
    {% if not HIDE_DATE %}<time datetime={{ article.date.isoformat() }}>{{article.locale_date }}</time>{% endif %}
    <div class="article-body">
    {{ article.content }}
    </div>
</article>
{% endblock %}
